<!DOCTYPE html>
<html>
<head>
    <title>>>> Transmitting Signal</title>
    <link rel="stylesheet" href="signal.css">
</head>

<body>

    <header>
        <h1 id="skipTestButton">“A Message from Glorp”</h1>
    </header>

    <main class="page">
        
        <aside>
            <div class="navbar">
                <h2 id="currentLevelText"></h2>

                <div class="chapter">
                    <span class="chapterName1">_____:</span>
                    <span id="levelSelector1"></span>
                </div>

                <div class="chapter">
                    <span class="chapterName2">_____:</span>
                    <span id="levelSelector2"></span>
                </div>

                <div class="chapter">
                    <span class="chapterName3">_____:</span>
                    <span id="levelSelector3"></span>
                </div>

            </div>
        </aside>

        <main class="gameSpace">
                <!-- <h2 id="currentLevelText"></h2> -->
                

            <div class="noBorder respondSignalDiv">
                <p id="respondSignal">placeholder</p>
            </div>
            <div class="noBorder hintSignalDiv">
                <p id="hintSignal">placeholder</p>
            </div>

            <div class="noBorder">
                <p id="questionSignal">0</p>
            </div>



            <div>
                <input id="signalInput" type="text" placeholder="> awaiting response" autocomplete="off">
                <button id="sendButton">send</button>
            </div>
        </main>
        
    </main>

    <main class="page2">
        <main>
            <div class="noBorder dictionaryHeader">
                <h2 id="testButton">dictionARy</h2>
                <button id="recompileButton">recompile</button>
            </div>
        </main>

        <main>
            <div class="noBorder dictionarySection" id="refSection">
                <p id="refFreqText1">1420405752</p>
                <p id="refFreqText2">the reference signal</p>
            </div>

            <div class="noBorder dictionarySection" id="ne2Section">
                <p id="ne2Text">1420405750</p>
                <input class="dictionaryInput" id="ne2Input" type="text" placeholder="> undefined" autocomplete="off">
            </div>

            <div class="noBorder dictionarySection" id="ne3Section">
                <p>@-3_undef</p>
                <input class="dictionaryInput" id="ne3Input" type="text" placeholder="> undefined" autocomplete="off">
            </div>

            <div class="noBorder dictionarySection" id="ne4Section">
                <p>@-4_undef</p>
                <input class="dictionaryInput" id="ne4Input" type="text" placeholder="> undefined" autocomplete="off">
            </div>

            <div class="noBorder dictionarySection" id="ne5Section">
                <p>@-5_undef</p>
                <input class="dictionaryInput" id="ne5Input" type="text" placeholder="> undefined" autocomplete="off">
            </div>

            <div class="noBorder dictionarySection" id="ne1Section">
                <p>@-1_undef</p>
                <input class="dictionaryInput" id="ne1Input" type="text" placeholder="> undefined" autocomplete="off">
            </div>

            <div class="noBorder dictionarySection" id="ne6Section">
                <p>@-6_undef</p>
                <input class="dictionaryInput" id="ne6Input" type="text" placeholder="> undefined" autocomplete="off">
            </div>
        </main>
    </main>




    <section class="musicPlayer">
        <div class="playerControls">
            <button id="previousButton">previous</button>
            <button id="playButton">play</button>
            <button id="nextButton">next</button>
        </div>

        <div class="playerTrack">
            <p id="trackName">no track playing</p>
            <p id="trackArtist">---</p>
        </div>

        

        <div class="playerVolume">
            <span>vol</span>
            <input type="range" id="volumeSlider"
                min="0.2" max="0.75" step="0.01" value="0.37">
        </div>

        <audio id="audioPlayer"></audio>
    </section>

    
    <footer>
    </footer>


    <script src="signal.js"></script>
</body>
</html>
